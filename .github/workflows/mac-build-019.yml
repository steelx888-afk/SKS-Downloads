name: Build native Mac release payloads
on:
  workflow_dispatch:
    inputs:
      cache_tag:
        description: Existing private staging cache to resume, blank for a fresh build
        type: string
        required: false
      architecture:
        description: Native payloads to build
        type: choice
        options: [both, x64, arm64]
        default: both
      product:
        description: Product to build
        type: choice
        options: [all, lab, designz, proz]
        default: all
permissions:
  contents: write
concurrency:
  group: mac-native-019
  cancel-in-progress: false
env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GH_TOKEN: ${{ github.token }}
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      cache_tag: ${{ steps.cache.outputs.cache_tag }}
    env:
      CACHE_TAG: ${{ inputs.cache_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: cache
        run: python3 ci/mac-release.py prepare
  native:
    needs: prepare
    name: Build ${{ matrix.app }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        app: ${{ fromJSON(inputs.product == 'lab' && '["lab"]' || inputs.product == 'designz' && '["designz"]' || inputs.product == 'proz' && '["proz"]' || '["lab","designz","proz"]') }}
        runner: ${{ fromJSON(inputs.architecture == 'x64' && '["macos-15-intel"]' || inputs.architecture == 'arm64' && '["macos-15"]' || '["macos-15","macos-15-intel"]') }}
    env:
      PRODUCT: ${{ matrix.app }}
      BUILD_ARCH: ${{ matrix.runner == 'macos-15' && 'arm64' || 'x64' }}
      CACHE_TAG: ${{ needs.prepare.outputs.cache_tag }}
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: steelx888-afk/SKS-${{ matrix.app == 'lab' && 'LAB' || matrix.app == 'designz' && 'DESIGNZ' || 'PROZ' }}
          ref: v0.1.19
          path: private-source
          ssh-key: ${{ secrets[format('MAC_SOURCE_{0}', matrix.app == 'lab' && 'LAB' || matrix.app == 'designz' && 'DESIGNZ' || 'PROZ')] }}
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ci/mac-release.py native
