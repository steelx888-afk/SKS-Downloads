name: Diagnose packaged Mac agent startup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CACHE_TAG: mac-native-cache-019-43029374209
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ci/mac-diagnose.py
